name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  linux-ui:
    name: Linux UI smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install display server
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Click through every page and tab as three kinds of user
        run: STRC_KEEP_SHOTS=1 xvfb-run -a node scripts/ui-check.js
      - name: Collect screenshots
        if: always()
        run: mkdir -p shots && for d in /tmp/strc-uicheck-*/shots-*; do [ -d "$d" ] && cp -r "$d" shots/; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-screenshots
          path: shots

  build-linux:
    name: Build Linux (AppImage + tar.gz)
    needs: [test, linux-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:linux -- --publish never
      - name: Package for Steam Deck
        run: bash scripts/package-deck.sh
      - name: Check the Deck installer script
        run: bash -n scripts/install-steamdeck.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/*.AppImage
            dist/*.tar.gz
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.AppImage dist/*.tar.gz scripts/install-steamdeck.sh --clobber

  build-windows:
    name: Build Windows (portable exe)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" dist/STR-Companion-*.exe --clobber

  checksums:
    name: Release checksums
    if: github.event_name == 'release'
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS.txt for every release file (used by the Deck installer and self-update)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*' --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
