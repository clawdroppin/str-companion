<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>STR Companion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 4 8v8c0 7 5 12 12 14 7-2 12-7 12-14V8L16 2Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 15h12M16 9v14" stroke="currentColor" stroke-width="2"/></svg>
      </div>
      <div>
        <div class="brand-name">STR Companion</div>
        <div class="brand-sub">Skyrim Together co-op</div>
      </div>
    </div>
    <nav id="nav">
      <button data-page="dashboard" class="active"><span class="ico">◆</span>Dashboard</button>
      <button data-page="play"><span class="ico">▶</span>Play &amp; Server</button>
      <button data-page="mods"><span class="ico">✦</span>Mods</button>
      <button data-page="cleanup"><span class="ico">⚑</span>Cleanup</button>
      <button data-page="config"><span class="ico">⚙</span>Config Editor</button>
      <button data-page="friends"><span class="ico">⇄</span>Friends Sync</button>
      <button data-page="session"><span class="ico">✓</span>Session Checklist</button>
      <button data-page="backups"><span class="ico">⟲</span>Backups</button>
      <button data-page="logs"><span class="ico">≡</span>Logs</button>
      <button data-page="settings"><span class="ico">☰</span>Settings</button>
    </nav>
    <div class="sidebar-foot" id="gameDirFoot"></div>
  </aside>
  <main id="main"></main>
  <div id="toasts"></div>
  <div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
  <script src="app.js"></script>
</body>
</html>
